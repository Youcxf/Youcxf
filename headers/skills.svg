<svg xmlns="http://www.w3.org/2000/svg" width="900" height="56" viewBox="0 0 900 56">
<style>
.t{fill:#24292f;font:700 28px -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;letter-spacing:-.5px;opacity:0;will-change:opacity,filter;animation:fade 1.6s cubic-bezier(.45,0,.25,1) forwards,sharp 1.8s cubic-bezier(.4,0,.3,1) forwards}
.base{stroke:#24292f;stroke-opacity:.15}
.glow{stroke:url(#g);stroke-width:2;stroke-linecap:round;animation:sweep 5s cubic-bezier(.45,0,.25,1) infinite;will-change:transform}
.s0{stop-color:#8a8a8a;stop-opacity:0}.s1{stop-color:#8a8a8a}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sharp{from{filter:blur(4px)}to{filter:blur(0)}}
@keyframes sweep{0%{transform:translateX(-200px)}70%,100%{transform:translateX(900px)}}
@media (prefers-color-scheme:dark){.t{fill:#f0f0f0}.base{stroke:#ffffff;stroke-opacity:.14}.s1{stop-color:#d0d0d0}.s0{stop-color:#d0d0d0}}
@media (prefers-reduced-motion:reduce){.t{animation:none;opacity:1}.glow{animation:none;display:none}}
</style>
<defs><linearGradient id="g" x1="0" x2="1"><stop class="s0" offset="0"/><stop class="s1" offset=".5"/><stop class="s0" offset="1"/></linearGradient></defs>
<text class="t" x="2" y="30">skills</text>
<g transform="translate(0 46)"><line class="base" x1="0" y1="0" x2="900" y2="0"/><line class="glow" x1="0" y1="0" x2="200" y2="0"/></g>
</svg>
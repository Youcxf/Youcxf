<style>
.in{opacity:0;will-change:opacity,filter;animation:fade 2.2s cubic-bezier(.45,0,.25,1) forwards,sharp 2.4s cubic-bezier(.4,0,.3,1) forwards}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sharp{from{filter:blur(4px)}to{filter:blur(0)}}
.in2{opacity:0;animation:fade 1.5s cubic-bezier(.45,0,.25,1) forwards}
.orb{will-change:transform;animation:drift 18s ease-in-out infinite}
.o2{animation-duration:22s;animation-delay:-6s}
.o3{animation-duration:26s;animation-delay:-12s}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,30px)}}
@media (prefers-reduced-motion:reduce){.in,.in2,.orb{animation:none;opacity:1}}
@keyframes tw{0%,100%{opacity:.6}50%{opacity:1}}.tw{animation:tw 5s ease-in-out infinite}@keyframes fl{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,-8px)}}.cn{animation:fl 16s ease-in-out infinite}</style>
